services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ANOS_DB_PATH=/app/data/anos.db
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_MAX=100
      - MAX_BODY_SIZE=10485760
    volumes:
      - anos_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal-runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  anos_data:
    driver: local
