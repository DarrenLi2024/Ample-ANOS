# ANOS Tool Registry V1.0
#
# Tool 是 Agent 可调用的底层能力（API/数据库/MCP/外部服务）。

tools:
  - id: read-inquiry-base
    code: API-TRD-DEV-000001
    name: 读取 Inquiry Base
    type: DataTool
    endpoint: /api/inquiries
    method: GET

  - id: write-inquiry-base
    code: API-TRD-DEV-000002
    name: 写入 Inquiry Base
    type: DataTool
    endpoint: /api/inquiries
    method: POST
    require_confirm: true

  - id: read-offer-base
    code: API-TRD-DEV-000003
    name: 读取 Offer Base
    type: DataTool
    endpoint: /api/supply-resources
    method: GET

  - id: write-offer-base
    code: API-TRD-DEV-000004
    name: 写入 Offer Base
    type: DataTool
    endpoint: /api/supply-resources
    method: POST
    require_confirm: true

  - id: read-customer-base
    code: API-SALES-DEV-000001
    name: 读取客户信息
    type: DataTool
    endpoint: /api/customers
    method: GET

  - id: read-supplier-base
    code: API-TRD-DEV-000005
    name: 读取供应商信息
    type: DataTool
    endpoint: /api/suppliers
    method: GET

  - id: read-ar-base
    code: API-FIN-DEV-000001
    name: 读取 AR 数据
    type: DataTool
    endpoint: /api/ar
    method: GET

  - id: deepseek-ocr
    code: API-TRD-DEV-000006
    name: DeepSeek OCR
    type: AITool
    endpoint: /api/parse/clipboard
    method: POST

  - id: inbox-submit
    code: API-TRD-DEV-000007
    name: AI Inbox 提交
    type: IntegrationTool
    endpoint: /api/inbox/submit
    method: POST
